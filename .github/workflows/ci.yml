name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (pyscard)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swig libpcsclite-dev

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar el paquete
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,tui,gp]'

      - name: Ejecutar la suite (offline, sin hardware)
        run: python -m pytest tests/ -q
